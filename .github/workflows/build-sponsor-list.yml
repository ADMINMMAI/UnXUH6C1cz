for folder in */
do
  if [[ "$folder" == ".github/" ]]; then
    continue
  fi

  name=$(basename "$folder")

  # find image safely
  image=$(find "$folder" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" -o -iname "*.gif" \) | head -n 1)

  if [ -z "$image" ]; then
    echo "Skipping $folder (no image)"
    continue
  fi

  # require info.json
  if [ ! -f "$folder/info.json" ]; then
    echo "Skipping $folder (no info.json)"
    continue
  fi

  # normalize path
  image=$(echo "$image" | sed 's#^\./##')

  if [ "$first" = true ]; then
    first=false
  else
    echo "," >> sponsors.json
  fi

  echo "  {" >> sponsors.json
  echo "    \"folder\": \"$name\"," >> sponsors.json
  echo "    \"image\": \"$image\"" >> sponsors.json
  echo "  }" >> sponsors.json

done
